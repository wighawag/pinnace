<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="pinnace">
	<title>pinnace</title>
	<rect width="64" height="64" rx="14" fill="#0B1F33" />
	<!-- pin head: the masthead doubles as a map pin -->
	<circle cx="32" cy="9" r="4.2" fill="#4FD1C5" />
	<!-- mast / pin needle -->
	<path d="M30.7 40 H33.3 V12 H30.7 Z" fill="#F8FAFC" />
	<!-- mainsail -->
	<path d="M34.2 13 C42 19 47 28 49 38 L34.2 38 Z" fill="#F8FAFC" />
	<!-- jib -->
	<path d="M29.8 18 V38 H16 C19.5 29 24.2 23 29.8 18 Z" fill="#4FD1C5" />
	<!-- hull -->
	<path d="M9 40 H55 L49.5 50.5 C48.5 52.2 46.6 53 44.4 53 H23 C17.4 53 12.2 47.6 9 40 Z" fill="#F8FAFC" />
	<!-- water -->
	<g stroke="#4FD1C5" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
		<path d="M10 58.5 H26" />
		<path d="M33 58.5 H54" />
	</g>
</svg>
